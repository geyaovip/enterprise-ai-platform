name: enterprise-ai-platform
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: suite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: suite
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite -d suite"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    image: enterprise-ai-platform/api:${RELEASE_TAG:?Set RELEASE_TAG}
    env_file: ../.env.production
    command: ["pnpm", "--filter", "@suite/api", "db:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: enterprise-ai-platform/api:${RELEASE_TAG:?Set RELEASE_TAG}
    env_file: ../.env.production
    environment:
      KNOWLEDGE_STORAGE_DIR: /var/lib/suite/knowledge
    volumes:
      - knowledge_originals:/var/lib/suite/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4600/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    image: enterprise-ai-platform/api:${RELEASE_TAG:?Set RELEASE_TAG}
    env_file: ../.env.production
    environment:
      KNOWLEDGE_STORAGE_DIR: /var/lib/suite/knowledge
    volumes:
      - knowledge_originals:/var/lib/suite/knowledge
    command: ["node", "apps/api/dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4602/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    image: enterprise-ai-platform/web:${RELEASE_TAG:?Set RELEASE_TAG}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        FRONTEND: admin
        SUITE_PUBLIC_BASE: /tenant-admin/
    image: enterprise-ai-platform/admin:${RELEASE_TAG:?Set RELEASE_TAG}
    environment:
      SITE_ADDRESS: ":80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  platform-admin:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
      args:
        FRONTEND: platform-admin
        SUITE_PUBLIC_BASE: /platform-admin/
    image: enterprise-ai-platform/platform-admin:${RELEASE_TAG:?Set RELEASE_TAG}
    environment:
      SITE_ADDRESS: ":80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  knowledge_originals:
  postgres_data:
  caddy_data:
  caddy_config:
