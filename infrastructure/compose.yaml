services:
  postgres:
    image: postgres:17-alpine
    pull_policy: never
    environment:
      POSTGRES_USER: suite_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local shell or .env}
      POSTGRES_DB: suite_dev
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - suite_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suite_dev -d suite_dev"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  suite_postgres_data:
