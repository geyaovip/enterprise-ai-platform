name: Build and SEO checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Used by Prisma code generation only; CI never starts or migrates a database.
      DATABASE_URL: postgresql://suite_ci:ci_only@127.0.0.1:5432/suite_ci
      PUBLIC_SITE_ORIGIN: https://zhixingark.cn
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install pinned package manager
        run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @suite/api build
      - run: pnpm build:cloud
      - run: pnpm test:seo
      - name: Package verified frontend builds
        if: github.ref == 'refs/heads/main'
        run: |
          printf '%s\n' "$GITHUB_SHA" > release-sha.txt
          tar -czf frontends.tar.gz release-sha.txt \
            apps/web/dist apps/admin/dist apps/platform-admin/dist \
            var/cloud-frontend-assets cloudflare/frontend-worker.js cloudflare/public-routes.mjs \
            wrangler.workspace.jsonc wrangler.tenant-admin.jsonc wrangler.platform-admin.jsonc
      - name: Store release artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: frontends-${{ github.sha }}
          path: frontends.tar.gz
          if-no-files-found: error
          retention-days: 30
